<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    :root {
      --font-ui: "Segoe UI Variable Text", "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
      --hint-bg: #202020;
      --hint-border: rgba(255, 255, 255, 0.10);
      --hint-text: #ffffff;
      --accent: #60cdff;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --hint-bg: #f9f9f9;
        --hint-border: rgba(0, 0, 0, 0.08);
        --hint-text: #1a1a1a;
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
    canvas { 
      position: fixed; inset: 0; 
      width: 100%; height: 100%; 
      pointer-events: none;
    }
    #u { z-index: 5; }
    #r { z-index: 10; }
    body.select-mode #u { pointer-events: auto; cursor: crosshair; }
    #hint {
      position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
      display: flex; align-items: center; gap: 8px;
      max-width: min(560px, calc(100vw - 32px));
      padding: 7px 13px 7px 11px; border-radius: 8px;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.18);
      font: 600 12.5px var(--font-ui);
      letter-spacing: 0.05px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
      z-index: 20; pointer-events: none;
      will-change: opacity, transform;
    }
    #hint::before {
      content: '';
      width: 6px; height: 6px; flex: 0 0 auto;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 2px rgba(96, 205, 255, 0.18);
    }
    @media (prefers-color-scheme: light) {
      #hint { background: rgba(0, 0, 0, 0.62); color: #fff; border-color: rgba(255,255,255,0.25); }
    }
    #subtitle {
      position: fixed;
      left: 50%;
      bottom: 6vh;
      transform: translateX(-50%) translateY(10px);
      width: min(1100px, calc(100vw - 80px));
      max-width: calc(100vw - 80px);
      padding: 0;
      border-radius: 0;
      background: transparent;
      color: #fff;
      border: none;
      box-shadow: none;
      font: 600 34px/1.35 var(--font-ui);
      letter-spacing: 0.01em;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      z-index: 30;
      pointer-events: none;
      opacity: 0;
      transition: opacity 180ms ease, transform 220ms ease;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      text-shadow: 0 2px 4px rgba(0,0,0,0.95), 0 4px 18px rgba(0,0,0,0.75), 0 0 2px rgba(0,0,0,1);
    }
    #subtitle.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #subtitle .sub-inner {
      display: inline-block;
      white-space: nowrap;
      will-change: transform;
      padding: 0 2px;
    }
    @media (prefers-color-scheme: light) {
      #subtitle { color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,0.8), 0 0 2px rgba(0,0,0,0.9); }
    }
    @media (prefers-reduced-motion: reduce) {
      #hint, #subtitle { transition-duration: 0.001ms !important; }
      #subtitle .sub-inner { animation: none !important; margin-left: 0 !important; }
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <canvas id="u"></canvas>
  <canvas id="r"></canvas>
  <div id="viz3d" style="position:fixed;inset:0;z-index:4;pointer-events:none;opacity:0;transition:opacity .35s ease"></div>
  <canvas id="viz3dsoft" style="position:fixed;inset:0;z-index:4;pointer-events:none;opacity:0;transition:opacity .35s ease"></canvas>
  <div id="subtitle" aria-live="polite"></div>
  <script src="../assets/Engine/clicky-three.js"></script>
  
  <script>
    const rCanvas = document.getElementById('r');
    const ctx = rCanvas.getContext('2d');
    const uCanvas = document.getElementById('u');
    const uctx = uCanvas.getContext('2d');
    const hint = document.getElementById('hint');
    const subtitleEl = document.getElementById('subtitle');

    // Separate annotation canvas (layer "a") for AI-drawn overlays, 2D schematics and HUD
    const aCanvas = document.createElement('canvas');
    aCanvas.id = 'a';
    aCanvas.style.cssText = 'position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:6;';
    document.body.appendChild(aCanvas);
    const aCtx = aCanvas.getContext('2d');
    let annotations = [];
    let viewMode = null; // '2d' | '3d' | null
    let viewMeta = { title: '', steps: [], focus: '' };
    let vizAnimId = null;

    function resizeAnnotations() {
      const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
      aCanvas.width = Math.floor(window.innerWidth * dpr);
      aCanvas.height = Math.floor(window.innerHeight * dpr);
      aCanvas.style.width = window.innerWidth + 'px';
      aCanvas.style.height = window.innerHeight + 'px';
      aCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener('resize', resizeAnnotations);
    resizeAnnotations();

    // ===== Professional 3D visualization (Three.js WebGL if capable, else software 3D canvas) =====
    const viz3dEl = document.getElementById('viz3d');
    const viz3dSoft = document.getElementById('viz3dsoft');
    let three = { renderer: null, scene: null, camera: null, group: null, parts: [], clockStart: 0, ready: false };
    let soft3d = { ctx: null, w: 0, h: 0, dpr: 1, ready: false, clockStart: 0, model: null, modelName: '', loading: false };
    const sampleModelUrl = '../assets/Engine/sample-model.obj';

    function getThreeLib() {
      const candidates = [window.THREE, window.__THREE__, window.ClickyThreeLib, window.three, window.THREEJS];
      for (const c of candidates) {
        if (c && typeof c === 'object' && c.Scene && c.WebGLRenderer) {
          if (!window.THREE || typeof window.THREE === 'string') window.THREE = c;
          return c;
        }
      }
      for (const c of candidates) { if (c && typeof c === 'object' && c.Scene) return c; }
      return null;
    }
    function ensureThree() {
      if (three.ready) return true;
      const T = getThreeLib();
      if (!T || !viz3dEl) return false;
      try {
        const renderer = new T.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x000000, 0);
        viz3dEl.appendChild(renderer.domElement);
        const scene = new T.Scene();
        const camera = new T.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 1.2, 6);
        scene.add(camera);
        const amb = new T.AmbientLight(0x88ccff, 0.8); scene.add(amb);
        const key = new T.DirectionalLight(0xffffff, 1.1); key.position.set(3,4,5); scene.add(key);
        const rim = new T.DirectionalLight(0x60cdff, 0.8); rim.position.set(-4,2,-3); scene.add(rim);
        const group = new T.Group(); scene.add(group);
        three = { renderer, scene, camera, group, parts: [], clockStart: performance.now(), ready: true };
        window.addEventListener('resize', () => {
          if (!three.ready) return;
          three.camera.aspect = window.innerWidth / window.innerHeight;
          three.camera.updateProjectionMatrix();
          three.renderer.setSize(window.innerWidth, window.innerHeight);
        });
        return true;
      } catch (e) { console.warn('Three init failed', e); return false; }
    }
    function clearThreeScene() {
      if (!three.ready) return;
      while (three.group.children.length) {
        const o = three.group.children.pop();
        try { o.geometry?.dispose?.(); } catch {}
        try { if (Array.isArray(o.material)) o.material.forEach(m=>m.dispose?.()); else o.material?.dispose?.(); } catch {}
      }
      three.parts = [];
    }
    function ensureSoft3D() {
      if (!viz3dSoft) return false;
      const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
      const w = window.innerWidth, h = window.innerHeight;
      if (!soft3d.ready || soft3d.w !== w || soft3d.h !== h || soft3d.dpr !== dpr) {
        viz3dSoft.width = Math.floor(w * dpr); viz3dSoft.height = Math.floor(h * dpr);
        viz3dSoft.style.width = w + 'px'; viz3dSoft.style.height = h + 'px';
        soft3d.ctx = viz3dSoft.getContext('2d');
        soft3d.ctx.setTransform(dpr,0,0,dpr,0,0);
        soft3d.w = w; soft3d.h = h; soft3d.dpr = dpr; soft3d.ready = true;
      }
      return !!soft3d.ctx;
    }
    function parseOBJ(text) {
      const verts = [], faces = [];
      String(text||'').split(/\r?\n/).forEach(line => {
        const l = line.trim(); if (!l || l.startsWith('#')) return;
        if (l.startsWith('v ')) { const p = l.split(/\s+/).slice(1).map(Number); if (p.length>=3) verts.push({x:p[0],y:p[1],z:p[2]}); }
        else if (l.startsWith('f ')) { const idx = l.split(/\s+/).slice(1).map(tok => { const i=parseInt(tok.split('/')[0],10); return i>0?i-1:verts.length+i; }).filter(i=>i>=0 && i<verts.length); if (idx.length>=3) faces.push(idx); }
      });
      return { verts, faces };
    }
    async function ensureSampleModelLoaded() {
      if (soft3d.model || soft3d.loading) return;
      soft3d.loading = true;
      try {
        const res = await fetch(sampleModelUrl);
        if (res && res.ok) { const txt = await res.text(); soft3d.model = parseOBJ(txt); soft3d.modelName = 'sample-model.obj'; }
      } catch (e) { /* ignore */ }
      soft3d.loading = false;
    }
    function rotatePoint(p, ax, ay, az) {
      let {x,y,z} = p;
      let cy=Math.cos(ay), sy=Math.sin(ay); let x1=x*cy+z*sy, z1=-x*sy+z*cy; x=x1; z=z1;
      let cx=Math.cos(ax), sx=Math.sin(ax); let y1=y*cx-z*sx, z2=y*sx+z*cx; y=y1; z=z2;
      let cz=Math.cos(az), sz=Math.sin(az); let x2=x*cz-y*sz, y2=x*sz+y*cz; x=x2; y=y2;
      return {x,y,z};
    }
    function projectPoint(p, w, h, scale, camZ) {
      const z = p.z + camZ; const f = scale / Math.max(0.6, z);
      return { x: w*0.5 + p.x*f, y: h*0.46 - p.y*f, z };
    }
    function drawSoft3D(now) {
      if (!ensureSoft3D() || viewMode !== '3d') return;
      const ctx = soft3d.ctx, w = soft3d.w, h = soft3d.h, t = ((now||performance.now()) - (soft3d.clockStart||performance.now()))*0.001;
      ctx.clearRect(0,0,w,h);
      // backdrop panel glow
      const cx=w*0.5, cy=h*0.46;
      const rg = ctx.createRadialGradient(cx,cy,10,cx,cy,Math.min(w,h)*0.38);
      rg.addColorStop(0,'rgba(96,205,255,0.10)'); rg.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle = rg; ctx.fillRect(0,0,w,h);

      const rotY = t*0.7, rotX = 0.45 + Math.sin(t*0.5)*0.12, rotZ = Math.sin(t*0.3)*0.08;
      const pulse = 0.5 + 0.5*Math.sin(t*2.0);
      const base = (soft3d.model && soft3d.model.verts && soft3d.model.verts.length) ? soft3d.model : null;
      const scale = Math.min(w,h)*0.17;

      // floor grid
      ctx.save();
      ctx.strokeStyle = 'rgba(96,205,255,0.18)'; ctx.lineWidth = 1;
      for(let i=-4;i<=4;i++){
        const a = rotatePoint({x:i*0.7,y:-1.05,z:-3.0}, rotX, rotY, 0); const b = rotatePoint({x:i*0.7,y:-1.05,z:3.0}, rotX, rotY, 0);
        const pa=projectPoint(a,w,h,scale,5.2), pb=projectPoint(b,w,h,scale,5.2); ctx.beginPath(); ctx.moveTo(pa.x,pa.y); ctx.lineTo(pb.x,pb.y); ctx.stroke();
        const c = rotatePoint({x:-3.0,y:-1.05,z:i*0.7}, rotX, rotY, 0); const d = rotatePoint({x:3.0,y:-1.05,z:i*0.7}, rotX, rotY, 0);
        const pc=projectPoint(c,w,h,scale,5.2), pd=projectPoint(d,w,h,scale,5.2); ctx.beginPath(); ctx.moveTo(pc.x,pc.y); ctx.lineTo(pd.x,pd.y); ctx.stroke();
      }
      ctx.restore();

      const drawMesh = (verts, faces, opts={}) => {
        const transformed = verts.map(v => rotatePoint(v, rotX, rotY, rotZ));
        const projected = transformed.map(v => projectPoint(v,w,h,scale,opts.camZ||5.2));
        const faceDraw = faces.map((f, idx) => {
          const tv = f.map(i=>transformed[i]); if (tv.length<3) return null;
          const avgZ = tv.reduce((s,v)=>s+v.z,0)/tv.length;
          const axv=tv[1].x-tv[0].x, ayv=tv[1].y-tv[0].y, azv=tv[1].z-tv[0].z;
          const bxv=tv[2].x-tv[0].x, byv=tv[2].y-tv[0].y, bzv=tv[2].z-tv[0].z;
          const nx = ayv*bzv-azv*byv, ny = azv*bxv-axv*bzv, nz = axv*byv-ayv*bxv;
          return { f, avgZ, nz, idx };
        }).filter(Boolean).sort((a,b)=>a.avgZ-b.avgZ);
        faceDraw.forEach(fd => {
          const pts = fd.f.map(i=>projected[i]); if (pts.some(p=>!isFinite(p.x))) return;
          const light = Math.max(0.15, Math.min(1, 0.35 + (fd.nz||0)*0.25));
          const alpha = opts.alpha!=null?opts.alpha:(0.18 + light*0.22);
          ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y); for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x, pts[i].y); ctx.closePath();
          if (opts.fill !== false) { ctx.fillStyle = opts.fillColor ? opts.fillColor(light, fd, t) : `rgba(96,205,255,${alpha})`; ctx.fill(); }
          ctx.strokeStyle = opts.stroke || `rgba(${140+light*80},${220},255,${0.35 + pulse*0.15})`;
          ctx.lineWidth = opts.lineWidth || 1.2; ctx.stroke();
        });
        // vertices glow
        if (opts.points) {
          projected.forEach((p,i)=>{ const tw = 0.5 + 0.5*Math.sin(t*3 + i*0.7); ctx.fillStyle = `rgba(255,255,255,${0.25+tw*0.5})`; ctx.beginPath(); ctx.arc(p.x,p.y,1.6+tw*0.8,0,Math.PI*2); ctx.fill(); });
        }
      };

      if (base) {
        drawMesh(base.verts, base.faces, { fillColor:(l)=>`rgba(${40+l*50|0},${120+l*80|0},${180+l*60|0},${0.22+l*0.22})`, stroke:'rgba(160,235,255,0.55)', lineWidth:1.3, points:true });
      } else {
        // procedural exploded schematic while model loads
        const cube = (cx3,cy3,cz3,sx,sy,sz) => {
          const v=[{x:cx3-sx,y:cy3-sy,z:cz3-sz},{x:cx3+sx,y:cy3-sy,z:cz3-sz},{x:cx3+sx,y:cy3+sy,z:cz3-sz},{x:cx3-sx,y:cy3+sy,z:cz3-sz},{x:cx3-sx,y:cy3-sy,z:cz3+sz},{x:cx3+sx,y:cy3-sy,z:cz3+sz},{x:cx3+sx,y:cy3+sy,z:cz3+sz},{x:cx3-sx,y:cy3+sy,z:cz3+sz}];
          const f=[[0,1,2,3],[4,5,6,7],[0,1,5,4],[2,3,7,6],[1,2,6,5],[0,3,7,4]]; return {v,f};
        };
        const parts = [
          cube(0,-0.4+Math.sin(t*1.2)*0.05,0,0.8,0.45,0.8),
          cube(0,0.9+Math.sin(t*1.6)*0.08,0,0.55,0.35,0.55),
          cube(-1.4+Math.sin(t)*0.05,0.1,0,0.35,0.25,0.35),
          cube(1.4-Math.sin(t)*0.05,0.1,0,0.35,0.25,0.35)
        ];
        parts.forEach((p,i)=> drawMesh(p.v,p.f,{ fillColor:(l)=> i===0?`rgba(96,205,255,${0.18+l*0.22})`:`rgba(120,180,255,${0.14+l*0.18})`, stroke:'rgba(170,235,255,0.7)' }));
      }

      // orbiting data nodes
      for(let i=0;i<8;i++){
        const a=t*0.9 + i*(Math.PI*2/8); const r=2.1 + Math.sin(t*1.4+i)*0.15; const yy=0.2 + Math.sin(t*1.8+i)*0.45;
        const p3 = rotatePoint({x:Math.cos(a)*r, y:yy, z:Math.sin(a)*r}, rotX*0.3, rotY*0.5, 0);
        const pp = projectPoint(p3,w,h,scale,5.2);
        const g = ctx.createRadialGradient(pp.x,pp.y,0,pp.x,pp.y,10);
        g.addColorStop(0,'rgba(255,255,255,0.95)'); g.addColorStop(1,'rgba(96,205,255,0)');
        ctx.fillStyle=g; ctx.beginPath(); ctx.arc(pp.x,pp.y,8,0,Math.PI*2); ctx.fill();
      }

      // HUD labels
      ctx.save(); ctx.font='600 13px "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif'; ctx.textAlign='center'; ctx.fillStyle='rgba(220,245,255,0.9)';
      const label = soft3d.modelName ? ('Modello 3D: ' + soft3d.modelName) : 'Rendering 3D animato (scene + nodi agentici)';
      ctx.fillText(label, cx, h*0.86);
      ctx.fillStyle='rgba(180,220,245,0.75)'; ctx.font='500 12px "Segoe UI",system-ui,sans-serif';
      ctx.fillText('Rotazione • esploso logico • flusso dati animato', cx, h*0.89);
      ctx.restore();
    }

    function buildExploded3DScene(title) {
      soft3d.clockStart = performance.now();
      // try WebGL Three first
      if (ensureThree()) {
        const T = getThreeLib();
        clearThreeScene();
        const g = three.group;
        try {
          const matMetal = new T.MeshStandardMaterial({ color: 0x2a3b55, metalness: 0.7, roughness: 0.25, emissive: 0x0b1a2a, emissiveIntensity: 0.35 });
          const matAccent = new T.MeshStandardMaterial({ color: 0x60cdff, metalness: 0.2, roughness: 0.3, emissive: 0x0a2a40, emissiveIntensity: 0.6, transparent: true, opacity: 0.95 });
          const base = new T.Mesh(new T.CylinderGeometry(1.8, 2.0, 0.25, 48), matMetal); base.position.set(0,-1.1,0); g.add(base);
          const core = new T.Mesh(new T.BoxGeometry(1.4, 1.0, 1.4), matAccent); core.position.set(0,-0.35,0); g.add(core);
          three.parts = { base, core }; three.clockStart = performance.now();
        } catch(e) { /* fallback below */ }
        viz3dEl.style.opacity = '1'; if (viz3dSoft) viz3dSoft.style.opacity = '0';
        return;
      }
      // software 3D fallback with external model loading
      ensureSoft3D(); ensureSampleModelLoaded();
      if (viz3dSoft) viz3dSoft.style.opacity = '1';
      if (viz3dEl) viz3dEl.style.opacity = '0';
    }
    function renderThree(now) {
      if (viewMode !== '3d') return;
      if (three.ready) {
        const t = ((now || performance.now()) - three.clockStart) * 0.001;
        const p = three.parts;
        if (p.core) { p.core.rotation.y = t * 0.6; p.core.position.y = -0.35 + Math.sin(t*1.2)*0.05; }
        three.group.rotation.y = Math.sin(t*0.25)*0.25;
        three.camera.lookAt(0,0.2,0);
        try { three.renderer.render(three.scene, three.camera); } catch {}
        return;
      }
      drawSoft3D(now);
    }
    function hideThree() {
      if (viz3dEl) viz3dEl.style.opacity = '0';
      if (viz3dSoft) viz3dSoft.style.opacity = '0';
    }

    // ===== Professional animated 2D schematic rendering =====
    function roundRectPath(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
    function drawGlowText(ctx, text, x, y, size=16, align='center', color='#fff') {
      ctx.save(); ctx.font = `600 ${size}px "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif`;
      ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.shadowColor = 'rgba(96,205,255,0.55)'; ctx.shadowBlur = 12; ctx.fillStyle = color; ctx.fillText(text,x,y); ctx.restore();
    }
    function drawAnimatedArrow(ctx, x1,y1,x2,y2, color, now, speed=0.0018) {
      const dx=x2-x1, dy=y2-y1, len=Math.hypot(dx,dy)||1, ux=dx/len, uy=dy/len;
      const grad = ctx.createLinearGradient(x1,y1,x2,y2);
      grad.addColorStop(0,'rgba(96,205,255,0.15)'); grad.addColorStop(1,color);
      ctx.save(); ctx.strokeStyle=grad; ctx.lineWidth=3; ctx.lineCap='round'; ctx.shadowColor=color; ctx.shadowBlur=10;
      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
      // moving particles along edge
      const t=(now*speed)%1; for(let k=0;k<3;k++){ const p=(t+k/3)%1; const px=x1+dx*p, py=y1+dy*p; ctx.fillStyle='rgba(255,255,255,'+(0.2+0.8*(1-Math.abs(p-0.5)*2))+')'; ctx.beginPath(); ctx.arc(px,py,3.2,0,Math.PI*2); ctx.fill(); }
      // head
      const ang=Math.atan2(dy,dx); ctx.fillStyle=color; ctx.beginPath(); ctx.moveTo(x2,y2);
      ctx.lineTo(x2-12*Math.cos(ang-0.45), y2-12*Math.sin(ang-0.45));
      ctx.lineTo(x2-12*Math.cos(ang+0.45), y2-12*Math.sin(ang+0.45)); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    function drawSchematic2D(now) {
      const w = window.innerWidth, h = window.innerHeight;
      const cx = w * 0.5, cy = h * 0.46;
      const t = now || performance.now();
      const pulse = 0.5 + 0.5*Math.sin(t*0.002);
      aCtx.save();
      // ambient panel
      const panelW = Math.min(980, w*0.8), panelH = 520;
      const px = cx-panelW/2, py = cy-panelH/2;
      const bg = aCtx.createLinearGradient(px,py,px,py+panelH);
      bg.addColorStop(0,'rgba(10,20,35,0.55)'); bg.addColorStop(1,'rgba(8,16,28,0.35)');
      aCtx.fillStyle = bg; aCtx.strokeStyle = 'rgba(96,205,255,'+(0.18+pulse*0.08)+')'; aCtx.lineWidth = 1.5;

      for (const p of gesturePoints) {
        if (p.x < minX) minX = p.x; if (p.y < minY) minY = p.y;
        if (p.x > maxX) maxX = p.x; if (p.y > maxY) maxY = p.y;
      }
      const w = maxX - minX, h = maxY - minY;
      if (w < 30 || h < 30 || w > 900 || h > 900) return;
      const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;

      // accumulate signed angle around centroid
      let totalAngle = 0;
      let valid = 0;
      for (let i = 1; i < gesturePoints.length; i++) {
        const a = gesturePoints[i - 1], b = gesturePoints[i];
        const a1 = Math.atan2(a.y - cy, a.x - cx);
        const a2 = Math.atan2(b.y - cy, b.x - cx);
        let d = a2 - a1;
        if (d > Math.PI) d -= Math.PI * 2;
        if (d < -Math.PI) d += Math.PI * 2;
        const ra = Math.hypot(a.x - cx, a.y - cy);
        const rb = Math.hypot(b.x - cx, b.y - cy);
        if (ra > 10 && rb > 10) { totalAngle += d; valid++; }
      }
      if (valid < 10) return;

      const turns = Math.abs(totalAngle) / (Math.PI * 2);
      const duration = now - gesturePoints[0].t;
      // Easier trigger: ~1 loop quickly, or sustained loop
      if (turns >= 1.25 || (turns >= 0.85 && duration >= 700) || (turns >= 0.7 && duration >= 1200)) {
        lastGestureTrigger = now;
        gesturePoints = []; // reset after detection
        dwellStart = 0; dwellPos = null; dwellTriggered = false;
        const pad = 10;
        const rect = { x: Math.max(0, Math.round(minX - pad)), y: Math.max(0, Math.round(minY - pad)), w: Math.round(w + pad * 2), h: Math.round(h + pad * 2) };
        setSelection(rect, { ttl: 8000 });
      }
    }

    if (window.fckclicky?.onOverlayMode) {
      window.fckclicky.onOverlayMode((payload) => {
        const mode = payload && payload.mode;
        if (mode === 'pointer') {
          overlayActive = true;

          if (!running) { running = true; requestAnimationFrame(animate); }
        } else if (mode === 'off') {
          overlayActive = false;
          // Clear transient selection when pointer/overlay is turned off
          try { setSelection(null); } catch {}
          dwellStart = 0; dwellPos = null; dwellTriggered = false;
          gesturePoints = [];
        }
      });
    }

    if (window.fckclicky?.onOverlayDraw) {
      window.fckclicky.onOverlayDraw((payload) => {
        if (payload && payload.clearSelections) { setSelection(null); }
        if (payload && payload.consumeSelection) { setSelection(null); }
        if (payload && payload.selection) { setSelection(payload.selection, { ttl: 6500, fromRefine: true }); }
      });
    }

    let selectionFadeToken = 0;
    function setSelection(rect, opts = {}) {
      selectionFadeToken++; // invalidate any running fade
      if (selectionExpireTimer) { clearTimeout(selectionExpireTimer); selectionExpireTimer = null; }
      selections = rect ? [rect] : [];
      lastSelection = rect || null;
      selectionOpacity = 1;
      selectionAnimStart = performance.now();
      if (rect) {
        try { selectionSound(); } catch {}
        if (!running) { running = true; requestAnimationFrame(animate); }
      }
      drawSelections();
      if (rect) {
        if (!opts.fromRefine) { try { window.fckclicky?.reportSelection?.(rect); } catch {} }
        const ttl = opts.ttl || 6500;
        const token = selectionFadeToken;
        selectionExpireTimer = setTimeout(() => {
          // only fade if this selection is still current
          if (token === selectionFadeToken) fadeOutSelection(token);
        }, ttl);
      } else {
        if (!opts.fromRefine) { try { window.fckclicky?.reportSelection?.(null); } catch {} }
      }
    }

    function fadeOutSelection(token = selectionFadeToken) {
      if (!selections.length) return;
      const fadeToken = token;
      const start = performance.now();
      const dur = 420;
      const step = (now) => {
        // aborted/replaced by a newer selection
        if (fadeToken !== selectionFadeToken) return;
        const k = Math.min(1, (now - start) / dur);
        selectionOpacity = 1 - k;
        drawSelections(now);
        if (k < 1 && selections.length) {
          requestAnimationFrame(step);
        } else {
          if (fadeToken !== selectionFadeToken) return;
          selections = [];
          lastSelection = null;
          selectionOpacity = 1;
          drawSelections(now);
          try { window.fckclicky?.reportSelection?.(null); } catch {}
        }
      };
      requestAnimationFrame(step);
    }

    function drawSelections(nowPerf) {
      const w = window.innerWidth, h = window.innerHeight;
      uctx.clearRect(0, 0, w, h);
      if (!selections.length) return;
      const now = nowPerf || performance.now();
      const appear = Math.min(1, (now - selectionAnimStart) / 260);
      const easeOut = 1 - Math.pow(1 - appear, 3);
      const pulse = 0.5 + 0.5 * Math.sin(now * 0.007);
      const pulse2 = 0.5 + 0.5 * Math.sin(now * 0.004 + 1.2);

      selections.forEach((r) => {
        const scale = 0.94 + 0.06 * easeOut;
        const cx = r.x + r.w / 2, cy = r.y + r.h / 2;
        const rw = r.w * scale, rh = r.h * scale;
        const rx = cx - rw / 2, ry = cy - rh / 2;

        uctx.save();
        uctx.globalAlpha = selectionOpacity * (0.7 + 0.3 * easeOut);

        // animated outer glow ring
        uctx.strokeStyle = `rgba(255, 220, 100, ${0.12 + pulse * 0.08})`;
        uctx.lineWidth = 6;
        uctx.shadowColor = 'rgba(255, 210, 80, 0.35)';
        uctx.shadowBlur = 18;
        uctx.beginPath();
        uctx.roundRect(rx - 2, ry - 2, rw + 4, rh + 4, 14);
        uctx.stroke();

        // soft fill (no full-screen dim)
        uctx.shadowBlur = 10;
        uctx.fillStyle = `rgba(255, 215, 60, ${0.045 + pulse * 0.02})`;
        uctx.strokeStyle = `rgba(255, 230, 140, ${0.88 + pulse * 0.1})`;
        uctx.lineWidth = 2.2;
        uctx.beginPath();
        uctx.roundRect(rx, ry, rw, rh, 12);
        uctx.fill();
        uctx.stroke();

        // animated dashed inner border
        uctx.shadowBlur = 0;
        uctx.setLineDash([8, 7]);
        uctx.lineDashOffset = -(now * 0.03);
        uctx.strokeStyle = `rgba(255, 245, 200, ${0.35 + pulse2 * 0.25})`;
        uctx.lineWidth = 1.5;
        uctx.beginPath();
        uctx.roundRect(rx + 5, ry + 5, Math.max(0, rw - 10), Math.max(0, rh - 10), 9);
        uctx.stroke();
        uctx.setLineDash([]);

        // scanning highlight line
        if (appear > 0.7) {
          const scanT = ((now * 0.00035) % 1);
          const sy = ry + 6 + (rh - 12) * scanT;
          const grad = uctx.createLinearGradient(rx, sy, rx + rw, sy);
          grad.addColorStop(0, 'rgba(255,255,255,0)');
          grad.addColorStop(0.5, `rgba(255,245,210,${0.12 + pulse * 0.08})`);
          grad.addColorStop(1, 'rgba(255,255,255,0)');
          uctx.fillStyle = grad;
          uctx.fillRect(rx + 6, sy - 1, Math.max(0, rw - 12), 2);
        }

        // animated corner accents
        uctx.strokeStyle = `rgba(255,250,220,${0.85 + pulse * 0.12})`;
        uctx.lineWidth = 2.5;
        uctx.lineCap = 'round';
        const c = 13 + pulse * 3;
        const corners = [[rx,ry,1,1],[rx+rw,ry,-1,1],[rx,ry+rh,1,-1],[rx+rw,ry+rh,-1,-1]];
        corners.forEach(([x,y,sx,sy]) => {
          uctx.beginPath();
          uctx.moveTo(x, y + sy*c);
          uctx.lineTo(x, y);
          uctx.lineTo(x + sx*c, y);
          uctx.stroke();
        });

        // center crosshair sparkle on appear
        if (appear < 1) {
          uctx.globalAlpha = selectionOpacity * (1 - appear) * 0.5;
          uctx.strokeStyle = 'rgba(255,245,210,0.9)';
          uctx.lineWidth = 1.5;
          const s = 18 * (1 - appear) + 6;
          uctx.beginPath();
          uctx.moveTo(cx - s, cy); uctx.lineTo(cx + s, cy);
          uctx.moveTo(cx, cy - s); uctx.lineTo(cx, cy + s);
          uctx.stroke();
        }

        uctx.restore();
      });
    }

    // Automatic selection by gesture (circles).

    function addTrailPoint(x, y, now) {
      const last = trail[0];
      if (!last || Math.hypot(x - last.x, y - last.y) > 2.5) {
        trail.unshift({ x, y, t: now });
        if (trail.length > MAX_TRAIL) trail.length = MAX_TRAIL;
      } else {
        last.t = now;
      }
    }

    function drawRibbon(now) {
      const w = window.innerWidth, h = window.innerHeight;
      ctx.clearRect(0, 0, w, h);
      const a = visibleAlpha * overlayFade;
      if (!head || trail.length < 2 || a <= 0.01) return;

      ctx.save();
      ctx.globalAlpha = a;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      // build smooth path points
      const pts = trail.slice(0, 45);
      if (pts.length < 2) { ctx.restore(); return; }

      // outer glow/shadow ribbon
      for (let pass = 0; pass < 3; pass++) {
        ctx.beginPath();
        ctx.moveTo(pts[0].x, pts[0].y);
        for (let i = 1; i < pts.length - 1; i++) {
          const p = pts[i], n = pts[i + 1];
          const mx = (p.x + n.x) / 2, my = (p.y + n.y) / 2;
          ctx.quadraticCurveTo(p.x, p.y, mx, my);
        }
        const last = pts[pts.length - 1];
        ctx.lineTo(last.x, last.y);

        if (pass === 0) {
          ctx.strokeStyle = 'rgba(255, 170, 0, 0.18)';
          ctx.lineWidth = 18;
          ctx.shadowColor = 'rgba(255, 200, 60, 0.35)';
          ctx.shadowBlur = 24;
        } else if (pass === 1) {
          const grad = ctx.createLinearGradient(pts[0].x, pts[0].y, last.x, last.y);
          grad.addColorStop(0, 'rgba(255, 230, 120, 0.95)');
          grad.addColorStop(0.5, 'rgba(255, 200, 40, 0.75)');
          grad.addColorStop(1, 'rgba(255, 170, 0, 0.15)');
          ctx.strokeStyle = grad;
          ctx.lineWidth = 7;
          ctx.shadowColor = 'rgba(255, 210, 80, 0.55)';
          ctx.shadowBlur = 14;
        } else {
          const grad2 = ctx.createLinearGradient(pts[0].x, pts[0].y, last.x, last.y);
          grad2.addColorStop(0, 'rgba(255, 255, 220, 0.9)');
          grad2.addColorStop(1, 'rgba(255, 230, 140, 0.0)');
          ctx.strokeStyle = grad2;
          ctx.lineWidth = 2.2;
          ctx.shadowBlur = 0;
        }
        ctx.stroke();
      }

      // trailing sparkles/dots
      for (let i = 2; i < Math.min(pts.length, 18); i += 3) {
        const p = pts[i];
        const prog = i / pts.length;
        const r = 3.2 * (1 - prog);
        ctx.beginPath();
        ctx.fillStyle = `rgba(255, 240, 180, ${0.55 * (1 - prog)})`;
        ctx.shadowColor = 'rgba(255, 210, 90, 0.7)';
        ctx.shadowBlur = 10;
        ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.shadowBlur = 0;

      // head glow
      const pulse = 0.92 + Math.sin(now * 0.008) * 0.08;
      const rg = ctx.createRadialGradient(head.x, head.y, 0, head.x, head.y, 26 * pulse);
      rg.addColorStop(0, 'rgba(255, 245, 210, 0.95)');
      rg.addColorStop(0.35, 'rgba(255, 210, 90, 0.45)');
      rg.addColorStop(1, 'rgba(255, 180, 0, 0)');
      ctx.fillStyle = rg;
      ctx.beginPath();
      ctx.arc(head.x, head.y, 26 * pulse, 0, Math.PI * 2);
      ctx.fill();

      // white cursor/arrow-like head marker
      ctx.save();
      ctx.translate(head.x, head.y);
      ctx.fillStyle = 'rgba(255,255,255,0.95)';
      ctx.strokeStyle = 'rgba(30,30,30,0.35)';
      ctx.lineWidth = 1;
      ctx.shadowColor = 'rgba(255,220,120,0.8)';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(0, 16);
      ctx.lineTo(4.5, 11.5);
      ctx.lineTo(7.5, 18);
      ctx.lineTo(10, 17);
      ctx.lineTo(7, 10.5);
      ctx.lineTo(12, 10.5);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.restore();

      ctx.restore();
    }

    function animate(now) {
      // master overlay fade for seamless activation/deactivation
      const fadeTarget = overlayActive ? 1 : 0;
      overlayFade += (fadeTarget - overlayFade) * (overlayActive ? 0.22 : 0.16);

      // smooth head toward target (fluid, low-latency)
      if (target && head) {
        const dx = target.x - head.x;
        const dy = target.y - head.y;
        const dist = Math.hypot(dx, dy);
        const ease = dist > 120 ? 0.38 : dist > 40 ? 0.3 : 0.22;
        head.x += dx * ease;
        head.y += dy * ease;
        addTrailPoint(head.x, head.y, now);
      }

      const idleFor = target ? (now - lastMoveAt) : 9999;
      if (idleFor > IDLE_MS) {
        const k = Math.min(1, (idleFor - IDLE_MS) / FADE_MS);
        const eased = 1 - Math.pow(1 - k, 3);
        visibleAlpha = Math.max(0, 1 - eased);
        // trim trail for seamless disappear
        if (trail.length > 0 && eased > 0.12) trail.pop();
        if (trail.length > 0 && eased > 0.4) trail.pop();
        if (trail.length > 0 && eased > 0.7) trail.pop();
      } else if (overlayActive) {
        visibleAlpha = Math.min(1, visibleAlpha + (1 - visibleAlpha) * 0.22);
      }

      

      // age out old points
      const cutoff = now - 500;
      while (trail.length > 1 && trail[trail.length - 1].t < cutoff) trail.pop();

      drawRibbon(now);
      if (selections.length) drawSelections(now);

      if (!overlayActive && overlayFade <= 0.02) {
        visibleAlpha = 0;
        target = null;
        head = null;
        trail = [];
        ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      }

      if (!overlayActive && overlayFade <= 0.02 && !selections.length) {
        running = false;
        return;
      }

      if (overlayActive && visibleAlpha <= 0.01 && (!target || idleFor > IDLE_MS + FADE_MS + 100)) {
        // keep loop alive while active for seamless reappearance
      } else if (!overlayActive && visibleAlpha <= 0.01 && (!target || idleFor > IDLE_MS + FADE_MS + 100) && selections.length) {
        // keep animating selection only
      } else if (!overlayActive && overlayFade <= 0.02 && !selections.length) {
        running = false;
        return;
      }

      requestAnimationFrame(animate);
    }
  </script>
