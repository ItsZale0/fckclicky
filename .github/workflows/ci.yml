name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax checks
        shell: pwsh
        run: |
          node -c main.js
          node -c preload.js
          node -c renderer/app.js
          node -c renderer/setup.js

      - name: Pack (unpacked app)
        run: npm run pack
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"